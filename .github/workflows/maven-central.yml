name: Maven Central

on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  pull_request:
    paths:
      - .github/workflows/maven-central.yml
      - '**/build.gradle.kts'
      - gradle.properties
  workflow_dispatch:
    inputs:
      version:
        description: VERSION_NAME to publish from main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: maven-central-${{ inputs.version || github.ref_name }}

jobs:
  maven-central:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check release version
        if: github.event_name != 'pull_request'
        env:
          EXPECTED_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: |
          version=$(sed -n 's/^VERSION_NAME=//p' gradle.properties)
          if [[ -z "$EXPECTED_VERSION" || "$EXPECTED_VERSION" != "$version" ]]; then
            echo "::error::Expected $EXPECTED_VERSION, but VERSION_NAME is $version"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Test the libraries
        run: ./gradlew :kson:jvmTest :kson-ksp:test :kson-ktor:test :kson-retrofit:test --console=plain

      - name: Verify staged Maven artifacts
        if: github.event_name == 'pull_request'
        run: |
          version=$(sed -n 's/^VERSION_NAME=//p' gradle.properties)
          repo="$RUNNER_TEMP/maven-staging"
          ./gradlew :kson:publishToMavenLocal :kson-ksp:publishToMavenLocal :kson-ktor:publishToMavenLocal :kson-retrofit:publishToMavenLocal "-Dmaven.repo.local=$repo" --console=plain
          for artifact in kson kson-jvm kson-macosarm64 kson-macosx64 kson-linuxx64 kson-linuxarm64 kson-mingwx64 kson-iosarm64 kson-iossimulatorarm64 kson-iosx64 kson-ksp kson-ktor kson-retrofit; do
            test -s "$repo/com/fajarnuha/kson/$artifact/$version/$artifact-$version.pom"
            test -s "$repo/com/fajarnuha/kson/$artifact/$version/$artifact-$version-sources.jar"
            test -s "$repo/com/fajarnuha/kson/$artifact/$version/$artifact-$version-javadoc.jar"
          done

      - name: Publish signed artifacts
        if: github.event_name != 'pull_request'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: |
          if [[ -z "$ORG_GRADLE_PROJECT_mavenCentralUsername" ||
                -z "$ORG_GRADLE_PROJECT_mavenCentralPassword" ||
                -z "$ORG_GRADLE_PROJECT_signingInMemoryKey" ||
                -z "$ORG_GRADLE_PROJECT_signingInMemoryKeyPassword" ]]; then
            echo "::error::Set the four Maven Central and signing secrets before publishing."
            exit 1
          fi
          ./gradlew publishAndReleaseToMavenCentral --console=plain
