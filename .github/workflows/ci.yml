name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            tasks: ":kson-core:jvmTest :kson-core:macosArm64Test :kson-core:iosSimulatorArm64Test :kson-cli:macosArm64Test"
          - os: ubuntu-latest
            tasks: ":kson-core:linuxX64Test :kson-cli:linuxX64Test"
          - os: windows-latest
            tasks: ":kson-core:mingwX64Test :kson-cli:mingwX64Test"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - run: ./gradlew ${{ matrix.tasks }} --console=plain
        shell: bash

  jq-parity:
    name: jq parity (jq 1.7.1)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: sudo apt-get install -y jq && jq --version
      - run: ./gradlew :kson-cli:linkReleaseExecutableLinuxX64 --console=plain
      - run: scripts/jq-parity.sh kson-cli/build/bin/linuxX64/releaseExecutable/kson.kexe

  cli:
    name: CLI binary (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: macos-latest, target: macosArm64, file: kson.kexe, name: kson-macos-arm64 }
          - { os: macos-latest, target: macosX64, file: kson.kexe, name: kson-macos-x64 }
          - { os: ubuntu-latest, target: linuxX64, file: kson.kexe, name: kson-linux-x64 }
          - { os: ubuntu-latest, target: linuxArm64, file: kson.kexe, name: kson-linux-arm64 }
          - { os: windows-latest, target: mingwX64, file: kson.exe, name: kson-windows-x64.exe }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :kson-cli:linkReleaseExecutable${{ matrix.target }} --console=plain
        shell: bash
      - run: |
          cp kson-cli/build/bin/${{ matrix.target }}/releaseExecutable/${{ matrix.file }} ${{ matrix.name }}
          if [[ "$RUNNER_OS" == macOS ]]; then
            mkdir package
            cp "${{ matrix.name }}" package/kson
            cp LICENSE package/LICENSE
            tar -czf "${{ matrix.name }}.tar.gz" -C package kson LICENSE
          fi
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}
            ${{ matrix.name }}.tar.gz

  release:
    name: Publish CLI release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [cli, jq-parity]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: kson-*
          path: dist
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  jitpack:
    name: Build kson-core on JitPack
    if: startsWith(github.ref, 'refs/tags/') && github.event.repository.private == false
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: curl --fail --location --show-error --retry 5 --retry-delay 10 "https://jitpack.io/com/github/fajarnuha/kson/${GITHUB_REF_NAME}/kson-${GITHUB_REF_NAME}.pom" -o /dev/null

  publish:
    name: Publish library to GitHub Packages
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: macos-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :kson-core:publishAllPublicationsToGitHubPackagesRepository --console=plain
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
