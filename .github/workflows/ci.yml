name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            tasks: ":kson-core:jvmTest :kson-core:macosArm64Test :kson-core:iosSimulatorArm64Test :kson-cli:macosArm64Test"
          - os: ubuntu-latest
            tasks: ":kson-core:linuxX64Test :kson-cli:linuxX64Test"
          - os: windows-latest
            tasks: ":kson-core:mingwX64Test :kson-cli:mingwX64Test"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - run: ./gradlew ${{ matrix.tasks }} --console=plain
        shell: bash

  cli:
    name: CLI binary (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: macos-latest, target: macosArm64, file: kson.kexe, name: kson-macos-arm64 }
          - { os: macos-latest, target: macosX64, file: kson.kexe, name: kson-macos-x64 }
          - { os: ubuntu-latest, target: linuxX64, file: kson.kexe, name: kson-linux-x64 }
          - { os: ubuntu-latest, target: linuxArm64, file: kson.kexe, name: kson-linux-arm64 }
          - { os: windows-latest, target: mingwX64, file: kson.exe, name: kson-windows-x64.exe }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :kson-cli:linkReleaseExecutable${{ matrix.target }} --console=plain
        shell: bash
      - run: cp kson-cli/build/bin/${{ matrix.target }}/releaseExecutable/${{ matrix.file }} ${{ matrix.name }}
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  publish:
    name: Publish library to GitHub Packages
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: macos-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :kson-core:publishAllPublicationsToGitHubPackagesRepository --console=plain
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
